<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Clauded GIT — spike</title>
<style>
  :root { color-scheme: dark; --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --fg:#e6e6e6; --dim:#8b93a7; --accent:#7aa2f7; --ok:#9ece6a; --ko:#f7768e; --warn:#e0af68; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; height:100vh; display:grid; grid-template-rows:auto 1fr auto; grid-template-columns: 1fr 340px; }
  header { grid-column:1/3; display:flex; gap:8px; align-items:center; padding:8px 12px; border-bottom:1px solid var(--line); background:var(--panel); flex-wrap:wrap; }
  header input { background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  header input.cwd { flex:1; min-width:280px; }
  button { background:#232838; color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:6px 10px; font:inherit; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); color:#0f1115; border-color:var(--accent); }
  button:disabled { opacity:.5; cursor:default; }
  #status { font-size:12px; color:var(--dim); margin-left:auto; }
  #status.running { color:var(--warn); } #status.idle { color:var(--ok); } #status.error { color:var(--ko); }
  main { overflow:auto; padding:12px 16px; display:flex; flex-direction:column; gap:10px; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow:auto; padding:12px; font-size:13px; }
  aside h3 { margin:0 0 8px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--dim); }
  .check { display:flex; gap:8px; padding:6px 0; border-bottom:1px solid var(--line); }
  .check .dot { width:10px; height:10px; border-radius:50%; margin-top:5px; flex:none; background:var(--dim); }
  .check.ok .dot { background:var(--ok); } .check.ko .dot { background:var(--ko); } .check.warn .dot { background:var(--warn); }
  .check .detail { color:var(--dim); font-size:12px; white-space:pre-wrap; word-break:break-word; }
  .msg { max-width:900px; border-radius:8px; padding:8px 12px; white-space:pre-wrap; word-break:break-word; }
  .user { background:#1f2a44; align-self:flex-end; }
  .assistant { background:var(--panel); border:1px solid var(--line); }
  .thinking { color:var(--dim); font-style:italic; border-left:2px solid var(--line); padding-left:10px; }
  details.tool { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:4px 10px; max-width:900px; font-size:13px; }
  details.tool summary { cursor:pointer; color:var(--accent); }
  details.tool summary .kind { color:var(--dim); margin-left:6px; }
  details.tool pre { margin:6px 0 4px; white-space:pre-wrap; word-break:break-word; max-height:300px; overflow:auto; color:#c0c7d6; font-size:12px; }
  details.sys summary { color:var(--warn); }
  details.result summary { color:var(--ok); }
  .perm { font-size:12px; color:var(--dim); }
  footer { grid-column:1/3; display:flex; gap:8px; padding:10px 12px; border-top:1px solid var(--line); background:var(--panel); }
  footer textarea { flex:1; min-height:44px; max-height:200px; resize:vertical; background:var(--bg); color:var(--fg); border:1px solid var(--line); border-radius:6px; padding:8px; font:inherit; }
</style>
</head>
<body>
<header>
  <input class="cwd" id="cwd" placeholder="Dossier de travail (cwd)" value="">
  <input id="resume" placeholder="session id à reprendre" size="36">
  <button id="start" class="primary">Nouvelle session</button>
  <button id="resumeBtn">Reprendre</button>
  <button id="interrupt" disabled>Stop</button>
  <span id="status">déconnecté</span>
</header>
<main id="log"></main>
<aside>
  <h3>Vérifications du spike</h3>
  <div id="checks"></div>
  <h3 style="margin-top:16px">Session</h3>
  <div id="session" class="check detail" style="display:block;color:var(--dim);font-size:12px">—</div>
</aside>
<footer>
  <textarea id="input" placeholder="Message… (Entrée pour envoyer, Maj+Entrée pour une nouvelle ligne)"></textarea>
  <button id="send" class="primary">Envoyer</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);
const log = $('log'), checksEl = $('checks'), statusEl = $('status'), sessionEl = $('session');
let ws, currentAssistant = null, currentText = '';
const checks = new Map();

function setStatus(state, text) { statusEl.className = state; statusEl.textContent = text; $('interrupt').disabled = state !== 'running'; }
function scroll() { log.scrollTop = log.scrollHeight; }
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
function short(s, n = 120) { s = String(s ?? ''); return s.length > n ? s.slice(0, n) + '…' : s; }
function pretty(v) { return typeof v === 'string' ? v : JSON.stringify(v, null, 2); }

function addUser(text) { log.append(el('div', 'msg user', text)); scroll(); }
function ensureAssistant() {
  if (!currentAssistant) { currentAssistant = el('div', 'msg assistant', ''); log.append(currentAssistant); currentText = ''; }
  return currentAssistant;
}
function closeAssistant() { currentAssistant = null; currentText = ''; }
function addTool(block) {
  const d = el('details', 'tool'); d.dataset.toolUseId = block.id;
  const s = el('summary', '', `${block.name}`);
  const input = block.input ?? {};
  const hint = input.command ?? input.file_path ?? input.pattern ?? input.description ?? input.prompt ?? input.query ?? input.skill ?? '';
  s.append(el('span', 'kind', short(hint, 100)));
  d.append(s);
  const pre = el('pre', '', pretty(input)); d.append(pre);
  log.append(d); scroll();
}
function addToolResult(block) {
  const target = [...log.querySelectorAll('details.tool')].reverse().find((d) => d.dataset.toolUseId === block.tool_use_id);
  const content = Array.isArray(block.content) ? block.content.map((c) => c.type === 'text' ? c.text : `[${c.type}]`).join('\n') : block.content;
  const pre = el('pre', '', (block.is_error ? '⚠️ ' : '→ ') + short(content, 4000));
  if (target) { target.append(pre); if (block.is_error) target.querySelector('summary').style.color = 'var(--ko)'; }
  else { const d = el('details', 'tool'); d.append(el('summary', '', 'résultat'), pre); log.append(d); }
  scroll();
}
function addDetails(cls, title, body) { const d = el('details', 'tool ' + cls); d.append(el('summary', '', title), el('pre', '', body)); log.append(d); scroll(); return d; }

function setCheck(name, status, detail) {
  let c = checks.get(name);
  if (!c) { c = el('div', 'check'); c.append(el('div', 'dot'), el('div')); checksEl.append(c); checks.set(name, c); }
  c.className = 'check ' + (status ?? '');
  const body = c.children[1]; body.replaceChildren(el('div', '', name), el('div', 'detail', detail ?? ''));
}

function onSdk(m) {
  switch (m.type) {
    case 'system': {
      if (m.subtype === 'init') {
        sessionEl.textContent = `id ${m.session_id}\nmodèle ${m.model}\nmode ${m.permissionMode}\ncwd ${m.cwd}`;
        $('resume').value = m.session_id;
        addDetails('sys', `init · ${m.model} · ${m.permissionMode} · ${(m.tools ?? []).length} outils · ${(m.slash_commands ?? []).length} commandes · ${(m.skills ?? []).length} skills`, pretty(m));
      } else addDetails('sys', `system · ${m.subtype}`, pretty(m));
      break;
    }
    case 'stream_event': {
      const ev = m.event;
      if (ev?.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { ensureAssistant(); currentText += ev.delta.text; currentAssistant.textContent = currentText; scroll(); }
      if (ev?.type === 'content_block_start' && ev.content_block?.type === 'tool_use') closeAssistant();
      break;
    }
    case 'assistant': {
      for (const block of m.message?.content ?? []) {
        if (block.type === 'text') { const a = ensureAssistant(); a.textContent = block.text; closeAssistant(); }
        else if (block.type === 'thinking') { log.append(el('div', 'msg thinking', short(block.thinking, 600))); }
        else if (block.type === 'tool_use') { closeAssistant(); addTool(block); }
      }
      break;
    }
    case 'user': {
      const content = m.message?.content;
      if (Array.isArray(content)) for (const block of content) { if (block.type === 'tool_result') addToolResult(block); }
      break;
    }
    case 'result': {
      closeAssistant();
      addDetails('result', `result · ${m.subtype} · ${m.num_turns} tours · ${(m.duration_ms / 1000).toFixed(1)} s · ${m.total_cost_usd?.toFixed?.(3) ?? '?'} $`, pretty(m));
      setStatus('idle', 'prêt');
      break;
    }
    default: addDetails('sys', m.type, pretty(m));
  }
}

function connect() {
  ws = new WebSocket(`ws://${location.host}/ws`);
  ws.onopen = () => setStatus('idle', 'connecté, aucune session');
  ws.onclose = () => setStatus('error', 'déconnecté (serveur arrêté ?)');
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === 'sdk') onSdk(m.message);
    else if (m.type === 'status') setStatus(m.state, m.text);
    else if (m.type === 'permission') { log.append(el('div', 'perm', `permission ${m.decision} · ${m.tool} · ${short(pretty(m.input), 160)}`)); scroll(); }
    else if (m.type === 'check') setCheck(m.name, m.status, m.detail);
    else if (m.type === 'cwd') $('cwd').value = m.cwd;
    else if (m.type === 'error') { addDetails('sys', 'erreur', m.message); setStatus('error', 'erreur'); }
  };
}
function send(obj) { ws.send(JSON.stringify(obj)); }

$('start').onclick = () => { log.replaceChildren(); closeAssistant(); send({ type: 'start', cwd: $('cwd').value }); };
$('resumeBtn').onclick = () => { log.replaceChildren(); closeAssistant(); send({ type: 'start', cwd: $('cwd').value, resume: $('resume').value }); };
$('interrupt').onclick = () => send({ type: 'interrupt' });
$('send').onclick = () => { const text = $('input').value.trim(); if (!text) return; addUser(text); send({ type: 'prompt', text }); $('input').value = ''; setStatus('running', 'Claude travaille…'); };
$('input').addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); $('send').click(); } });
connect();
</script>
</body>
</html>
